<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101811">
  <title>Révision Rallye — Entraînement visuel</title>
  <style>
    :root{color-scheme:dark;--bg:#101811;--panel:#18231b;--panel2:#202d23;--line:#344438;--ink:#f1f4eb;--muted:#b7c2b6;--green:#b7e17b;--green2:#d4f3a5;--red:#ff9b8e;--gold:#f0d48a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;background:radial-gradient(ellipse at 50% -20%,#30412a 0,transparent 48%),var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}
    button,select{font:inherit}button{cursor:pointer}.app{width:min(100%,760px);background:rgba(24,35,27,.96);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,38px);box-shadow:0 24px 80px #0006}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#2b3e2b;color:var(--green);font-size:23px}.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:750}.brand h1{font-size:1.25rem;margin:2px 0 0}.screen[hidden]{display:none!important}
    h2{font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.2;margin:0 0 10px}.lead{color:var(--muted);margin:0 0 24px}.field-label{display:block;font-weight:650;margin:22px 0 8px}select{width:100%;padding:13px 14px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px}
    .check-row{display:flex;gap:10px;align-items:center;margin:16px 0 24px;color:var(--muted)}input[type=checkbox]{accent-color:var(--green);width:18px;height:18px}.primary,.secondary{border:0;border-radius:12px;padding:13px 18px;font-weight:750}.primary{background:var(--green);color:#172016}.primary:hover{background:var(--green2)}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}.full{width:100%}.saved{color:var(--muted);font-size:.9rem;margin-top:16px}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.92rem}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--green2);font-size:.83rem}.track{height:8px;background:#29362a;border-radius:99px;overflow:hidden;margin:13px 0 28px}.track span{height:100%;display:block;width:0;background:var(--green);transition:width .25s}.question{font-size:clamp(1.15rem,3vw,1.4rem);font-weight:700;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--line);background:#202d23;color:var(--ink);transition:.16s}.option:hover:not(:disabled){border-color:var(--green);transform:translateY(-1px)}.option:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.letter{flex:0 0 28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#334333;color:var(--green2);font-weight:750;font-size:.84rem}.option.correct{border-color:#81bf6a;background:#233b27}.option.correct .letter{background:#42713d;color:white}.option.incorrect{border-color:#dc7163;background:#402725}.option.incorrect .letter{background:#903f36;color:white}.option:disabled{cursor:default}.explanation{margin-top:16px;padding:15px 16px;border-left:3px solid var(--green);background:#202d23;border-radius:4px 12px 12px 4px;color:#e0e8db}.explanation[hidden]{display:none}.actions{display:flex;gap:10px;margin-top:18px}.actions .primary{flex:1}.end-head{text-align:center;padding:8px 0 24px}.score{font-size:3rem;line-height:1.1;font-weight:800;color:var(--green);margin:10px 0}.result-note{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 25px}.stat{padding:14px 10px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:13px}.stat strong{display:block;font-size:1.25rem}.stat span{font-size:.8rem;color:var(--muted)}.review-title{margin:20px 0 10px;font-size:1rem}.review{border-top:1px solid var(--line);padding:13px 0}.review strong{display:block;margin-bottom:4px}.review p{margin:3px 0;color:var(--muted);font-size:.92rem}.review .right{color:var(--green2)}.review .wrong{color:var(--red)}.end-actions{display:flex;gap:10px;margin-top:22px}.end-actions>*{flex:1}.empty{color:var(--muted);padding:15px 0}
    @media(max-width:520px){body{padding:10px}.app{border-radius:17px}.end-actions{flex-direction:column}.topline{align-items:flex-start}.question{margin-top:4px}}
      .visual-panel{margin:0 0 20px;padding:12px 14px;background:#131d16;border:1px solid var(--line);border-radius:14px}.visual-heading{display:flex;align-items:center;gap:8px;margin:0 0 8px;color:var(--green2);font-size:.83rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase}.visual-heading span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);animation:beacon 1.8s ease-in-out infinite}.vehicle-diagram,.weapon-diagram{display:block;width:100%;height:auto;max-height:205px}.diagram-body{fill:#526253;stroke:#a2b2a0;stroke-width:2;stroke-linejoin:round}.diagram-dark{fill:#314033;stroke:#8da18a;stroke-width:2}.diagram-line{fill:none;stroke:#98aa96;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.diagram-wheel{fill:#18231b;stroke:#a2b2a0;stroke-width:4}.callout-line{stroke:var(--green);stroke-width:2;stroke-dasharray:4 4;animation:dash 2.4s linear infinite}.callout{fill:var(--green);stroke:#e1ffb8;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:spotlight 1.6s ease-in-out infinite}.callout.secondary{animation-delay:.6s}.diagram-label{fill:#eaf5df;font:700 12px system-ui,sans-serif}.diagram-caption{color:var(--muted);font-size:.82rem;margin:4px 0 0}@keyframes spotlight{0%,100%{opacity:.55;transform:scale(.78)}50%{opacity:1;transform:scale(1.3)}}@keyframes dash{to{stroke-dashoffset:-16}}@keyframes beacon{50%{opacity:.35;transform:scale(.78)}}@media(prefers-reduced-motion:reduce){.visual-panel *, .visual-panel *::before,.visual-panel *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="app">
  <header class="brand"><div class="mark" aria-hidden="true">✦</div><div><div class="eyebrow">Entraînement visuel</div><h1>Révision Rallye</h1></div></header>
  <section id="setup" class="screen" aria-labelledby="welcome-title">
    <h2 id="welcome-title">Prêt pour le rallye ?</h2>
    <p class="lead">Révise les indices visuels, avance à ton rythme et retrouve les réponses à revoir à la fin.</p>
    <label class="field-label" for="category">Choisir un thème</label>
    <select id="category"><option value="all">Tous les thèmes</option><option value="armes">Armement</option><option value="aeronefs">Aéronefs</option><option value="vehicules">Véhicules blindés</option><option value="drones">Drones</option></select>
    <label class="check-row"><input id="shuffle" type="checkbox" checked> Mélanger les questions et les choix</label>
    <button id="start" class="primary full">Commencer l’entraînement <span aria-hidden="true">→</span></button>
    <p id="best-score" class="saved" aria-live="polite"></p>
  </section>
  <section id="quiz" class="screen" hidden aria-labelledby="question-text">
    <div class="topline"><span id="counter">Question 1 sur 8</span><span id="topic" class="pill">Armement</span></div>
    <div class="track" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress"></span></div>
    <h2 id="question-text" class="question" tabindex="-1"></h2>
    <div id="visual" class="visual-panel" hidden></div>
    <div id="options" class="options" role="group" aria-label="Choix de réponse"></div>
    <div id="explanation" class="explanation" role="status" hidden></div>
    <div class="actions"><button id="quit" class="secondary">Quitter</button><button id="next" class="primary" hidden>Question suivante →</button></div>
  </section>
  <section id="results" class="screen" hidden aria-labelledby="result-title">
    <div class="end-head"><div class="eyebrow">Entraînement terminé</div><h2 id="result-title">Bien joué !</h2><div id="score" class="score">0 / 0</div><p id="result-note" class="result-note"></p></div>
    <div class="stats"><div class="stat"><strong id="correct-count">0</strong><span>Bonnes réponses</span></div><div class="stat"><strong id="wrong-count">0</strong><span>À revoir</span></div><div class="stat"><strong id="percent">0 %</strong><span>Réussite</span></div></div>
    <h3 class="review-title">Correction détaillée</h3><div id="review"></div>
    <div class="end-actions"><button id="retry-wrong" class="secondary" hidden>Revoir mes erreurs</button><button id="restart" class="primary">Nouvel entraînement</button></div>
  </section>
</main>
<script>
const bank=[
 {category:'armes',topic:'Armement',question:'Quel pistolet possède une carcasse en polymère et une sûreté intégrée au milieu de la queue de détente ?',options:['FN MAG','Glock 17','M24 Remington','HK416'],answer:1,explanation:'Le Glock 17 est reconnaissable à sa carcasse en polymère et à la languette de sûreté intégrée à la détente.'},
 {category:'armes',topic:'Armement',question:'Quelle mitrailleuse présente une poignée de transport au-dessus du canon et un couvercle d’alimentation supérieur ?',options:['FN MAG','Glock 17','Barrett M82','HK G36'],answer:0,explanation:'La FN MAG se distingue notamment par sa poignée de transport et son alimentation par bande sous un couvercle supérieur.'},
 {category:'aeronefs',topic:'Aéronefs',question:'Quel indice distingue le mieux un F-15 Eagle d’un F-16 Fighting Falcon ?',options:['Le F-15 est monoréacteur avec une verrière en bulle','Le F-15 a deux réacteurs et deux dérives, le F-16 un seul réacteur','Le F-16 a quatre réacteurs','Aucune différence visible'],answer:1,explanation:'Le F-15 possède deux réacteurs et deux dérives verticales. Le F-16 est monoréacteur, avec une entrée d’air sous le fuselage.'},
 {category:'vehicules',topic:'Véhicules blindés',visual:'namer',question:'Quel véhicule blindé lourd est construit sur un châssis de Merkava et peut recevoir le système de protection active Trophy ?',options:['Achzarit','Puma','Namer','Eitan'],answer:2,explanation:'Le Namer est un véhicule blindé lourd à chenilles construit sur un châssis de Merkava. Sa silhouette massive et ses chenilles sont des repères immédiats.'},
 {category:'vehicules',topic:'Véhicules blindés',visual:'eitan',question:'Quel véhicule de la liste est un blindé de transport de troupes à huit roues motrices ?',options:['Namer','Eitan','Puma','Panther'],answer:1,explanation:'L’Eitan est un véhicule blindé à roues en configuration 8×8. Repère ses roues, à distinguer des chenilles du Namer.'},
 {category:'aeronefs',topic:'Aéronefs',question:'Quel hélicoptère d’attaque possède un canon sous le nez et peut être équipé d’un radar Longbow au-dessus du rotor ?',options:['CH-53 Sea Stallion','UH-60 Black Hawk','AH-64 Apache','F-35 Lightning II'],answer:2,explanation:'L’AH-64 Apache est reconnaissable à son canon avant et, sur certaines versions, au radar Longbow au-dessus du rotor.'},
 {category:'aeronefs',topic:'Aéronefs',question:'Quel trait aide à distinguer le CH-53 Sea Stallion du UH-60 Black Hawk ?',options:['Le CH-53 est un hélicoptère de transport lourd, plus grand','Le CH-53 est un drone miniature','Le Black Hawk a trois rotors principaux','Le CH-53 est un avion de chasse'],answer:0,explanation:'Le CH-53 est un hélicoptère de transport lourd nettement plus grand que le Black Hawk.'},
 {category:'drones',topic:'Drones',question:'Quel drone de grande taille possède un empennage en V inversé et un radôme proéminent à l’avant ?',options:['Elbit Skylark 1','IAI Heron TP (Eitan)','Spike Firefly','IAI Harpy'],answer:1,explanation:'Le Heron TP (Eitan) est un drone MALE de grande dimension. Sa silhouette et son radôme avant aident à le reconnaître.'}
];
const $=id=>document.getElementById(id);let deck=[],index=0,score=0,history=[],locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.hidden=x.id!==id)}
function updateBest(){try{const b=JSON.parse(localStorage.getItem('revisionRallyeBest')||'{}');$('best-score').textContent=b.count?`Ton meilleur score : ${b.count}/${b.total} (${Math.round(b.count/b.total*100)} %).`:''}catch{$('best-score').textContent=''}}
function start(mode='selected',wrongOnly=false){let chosen=wrongOnly?history.filter(x=>!x.correct).map(x=>x.item):bank.filter(q=>mode==='all'||q.category===mode);if(!chosen.length)return;const mix=$('shuffle').checked;if(mix)shuffle(chosen);deck=chosen.map(q=>{const order=q.options.map((_,i)=>i);if(mix)shuffle(order);return {...q,answer:order.indexOf(q.answer),options:order.map(i=>q.options[i])}});index=0;score=0;history=[];show('quiz');load()}
function renderVisual(type){const box=$('visual');if(!type){box.hidden=true;box.replaceChildren();return}const diagrams={
glock:{label:'Silhouette schématique de pistolet avec carcasse et sûreté de détente mises en évidence',caption:'Repères extérieurs simplifiés : carcasse et sûreté intégrée à la détente.',svg:'<svg class="weapon-diagram" viewBox="0 0 560 190" role="img" aria-label="Silhouette schématique de pistolet"><path class="diagram-body" d="M92 61Q92 49 106 49H352Q369 49 378 62L397 83H459Q470 83 470 96V110H378L367 119H321L314 131H277L269 121H183L176 133H150L145 120H113Q98 120 96 107Z"/><path class="diagram-dark" d="M112 121H209L223 145 216 174Q214 181 205 181H168Q161 181 158 173L147 142H121Z"/><path class="diagram-dark" d="M250 120Q277 120 278 139Q279 151 265 157L256 148Q266 142 260 136H237Z"/><path class="diagram-line" d="M306 72H441M323 60H356M142 91H181"/><path class="callout-line" d="M266 144L338 164H428"/><circle class="callout" cx="266" cy="144" r="7"/><text class="diagram-label" x="435" y="168">sûreté de détente</text><path class="callout-line" d="M187 154L151 163H78"/><circle class="callout secondary" cx="187" cy="154" r="7"/><text class="diagram-label" x="8" y="168">carcasse polymère</text></svg>'},
fnmag:{label:'Silhouette schématique de mitrailleuse avec poignée et couvercle supérieur mis en évidence',caption:'Repères extérieurs simplifiés : poignée de transport et couvercle supérieur.',svg:'<svg class="weapon-diagram" viewBox="0 0 560 190" role="img" aria-label="Silhouette schématique de mitrailleuse"><path class="diagram-body" d="M76 88H172L197 76H325L351 85H443V103H352L330 113H198L173 105H76Z"/><path class="diagram-dark" d="M80 89 42 71 27 78 59 103 35 121 51 129 91 108Z"/><path class="diagram-dark" d="M192 74 201 59H319L332 75Z"/><path class="diagram-line" d="M327 94H507M218 116 208 157M305 116 327 156M206 157H337"/><path class="diagram-dark" d="M226 58Q233 31 255 31H276Q298 31 303 58Z"/><path class="callout-line" d="M264 36V17H382"/><circle class="callout" cx="264" cy="36" r="7"/><text class="diagram-label" x="389" y="21">poignée transport</text><path class="callout-line" d="M260 70V142H401"/><circle class="callout secondary" cx="260" cy="70" r="7"/><text class="diagram-label" x="408" y="147">couvercle supérieur</text></svg>'},
namer:{label:'Silhouette schématique de véhicule blindé à chenilles avec châssis haut mis en évidence',caption:'Schéma simplifié, pas à l’échelle : observe le profil massif et les chenilles.',svg:'<svg class="vehicle-diagram" viewBox="0 0 560 190" role="img" aria-label="Silhouette schématique du Namer"><path class="diagram-body" d="M68 88 92 63H184L208 48H343L365 65H457L482 89V119H68Z"/><path class="diagram-dark" d="M208 48 222 30H319L343 48Z"/><path class="diagram-line" d="M79 128H470"/><circle class="diagram-wheel" cx="116" cy="126" r="16"/><circle class="diagram-wheel" cx="166" cy="126" r="16"/><circle class="diagram-wheel" cx="216" cy="126" r="16"/><circle class="diagram-wheel" cx="266" cy="126" r="16"/><circle class="diagram-wheel" cx="316" cy="126" r="16"/><circle class="diagram-wheel" cx="366" cy="126" r="16"/><circle class="diagram-wheel" cx="416" cy="126" r="16"/><path class="callout-line" d="M204 126 147 164H68"/><circle class="callout" cx="204" cy="126" r="7"/><text class="diagram-label" x="8" y="171">chenilles</text><path class="callout-line" d="M270 57 342 20H428"/><circle class="callout secondary" cx="270" cy="57" r="7"/><text class="diagram-label" x="435" y="24">profil haut et massif</text></svg>'},
eitan:{label:'Silhouette schématique de véhicule blindé à huit roues avec roues mises en évidence',caption:'Schéma simplifié, pas à l’échelle : repère les roues, par contraste avec les chenilles du Namer.',svg:'<svg class="vehicle-diagram" viewBox="0 0 560 190" role="img" aria-label="Silhouette schématique de l’Eitan"><path class="diagram-body" d="M70 85 104 58 167 47H377L432 61 476 91V115H70Z"/><path class="diagram-dark" d="M128 57 144 35H183L193 57ZM252 47 265 31H306L319 47Z"/><path class="diagram-line" d="M83 121H466"/><circle class="diagram-wheel" cx="122" cy="119" r="18"/><circle class="diagram-wheel" cx="190" cy="119" r="18"/><circle class="diagram-wheel" cx="258" cy="119" r="18"/><circle class="diagram-wheel" cx="326" cy="119" r="18"/><circle class="diagram-wheel" cx="394" cy="119" r="18"/><circle class="diagram-wheel" cx="452" cy="119" r="18"/><path class="callout-line" d="M258 119 210 162H94"/><circle class="callout" cx="258" cy="119" r="7"/><text class="diagram-label" x="18" y="169">roues • configuration 8×8</text><path class="callout-line" d="M395 72 438 39H508"/><circle class="callout secondary" cx="395" cy="72" r="7"/><text class="diagram-label" x="444" y="35">blindé à roues</text></svg>'}};
const d=diagrams[type];if(!d){box.hidden=true;box.replaceChildren();return}box.hidden=false;box.innerHTML='<p class="visual-heading"><span aria-hidden="true"></span>Repères visuels animés</p>'+d.svg+'<p class="diagram-caption">'+d.caption+'</p>'}
function load(){locked=false;const q=deck[index];$('counter').textContent=`Question ${index+1} sur ${deck.length}`;$('topic').textContent=q.topic;$('question-text').textContent=q.question;$('progress').style.width=`${index/deck.length*100}%`;document.querySelector('.track').setAttribute('aria-valuenow',String(Math.round(index/deck.length*100)));renderVisual(q.visual);$('explanation').hidden=true;$('next').hidden=true;$('next').textContent=index===deck.length-1?'Voir mon résultat →':'Question suivante →';$('options').replaceChildren(...q.options.map((label,n)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${String.fromCharCode(65+n)}</span><span></span>`;b.lastElementChild.textContent=label;b.addEventListener('click',()=>answer(n));return b}));$('question-text').focus({preventScroll:true})}
function answer(n){if(locked)return;locked=true;const q=deck[index],ok=n===q.answer;if(ok)score++;history.push({item:q,selected:n,correct:ok});const buttons=$('options').children;for(let i=0;i<buttons.length;i++){buttons[i].disabled=true;if(i===q.answer)buttons[i].classList.add('correct');else if(i===n)buttons[i].classList.add('incorrect')}$('explanation').innerHTML='';const strong=document.createElement('strong');strong.textContent=ok?'Bonne réponse. ':'À retenir. ';$('explanation').append(strong,document.createTextNode(q.explanation));$('explanation').hidden=false;$('next').hidden=false;$('next').focus()}
function finish(){show('results');$('score').textContent=`${score} / ${deck.length}`;$('correct-count').textContent=score;$('wrong-count').textContent=deck.length-score;$('percent').textContent=`${Math.round(score/deck.length*100)} %`;$('result-title').textContent=score===deck.length?'Sans faute !':score/deck.length>=.7?'Très bon travail !':'Continue ta révision';$('result-note').textContent=score===deck.length?'Tous les indices sont bien identifiés.':'Consulte les explications puis entraîne-toi à nouveau.';$('review').replaceChildren(...history.map((r,i)=>{const row=document.createElement('article');row.className='review';const title=document.createElement('strong');title.textContent=`${i+1}. ${r.item.question}`;const state=document.createElement('p');state.className=r.correct?'right':'wrong';state.textContent=r.correct?'✓ Bonne réponse':`✗ Ta réponse : ${r.item.options[r.selected]}`;const answerLine=document.createElement('p');answerLine.textContent=`Réponse : ${r.item.options[r.item.answer]}`;const exp=document.createElement('p');exp.textContent=r.item.explanation;row.append(title,state,answerLine,exp);return row}));$('retry-wrong').hidden=score===deck.length;try{const old=JSON.parse(localStorage.getItem('revisionRallyeBest')||'{}');if(score>(old.count||0)||deck.length>(old.total||0))localStorage.setItem('revisionRallyeBest',JSON.stringify({count:score,total:deck.length}));}catch{}}
$('start').addEventListener('click',()=>start($('category').value));$('next').addEventListener('click',()=>{if(index+1<deck.length){index++;load()}else finish()});$('quit').addEventListener('click',()=>show('setup'));$('restart').addEventListener('click',()=>{show('setup');updateBest()});$('retry-wrong').addEventListener('click',()=>start('selected',true));document.addEventListener('keydown',e=>{if($('quiz').hidden||locked||!['1','2','3','4','a','b','c','d'].includes(e.key.toLowerCase()))return;const n='1234abcd'.indexOf(e.key.toLowerCase())%4;if(n<deck[index].options.length)$('options').children[n].click()});updateBest();
</script>
</body>
</html>
